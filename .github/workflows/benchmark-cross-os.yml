name: V++ portable language benchmark (macOS, Linux, Windows)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Independent samples per runtime/workload (minimum 3)
        required: true
        default: '5'
      target_ms:
        description: Minimum target batch duration in milliseconds (minimum 10)
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Windows runner has MSVC installed, but PowerShell does not
      # necessarily inherit cl.exe, link.exe and their INCLUDE/LIB paths.
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libjitterentropy3-dev zlib1g-dev libzstd-dev libffi-dev pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure and build V++ CLI from this revision
        run: |
          cmake -S . -B build-benchmark-cli -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build-benchmark-cli --config Release --parallel 2 --target vpp-cli

      - name: Benchmark on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_TARGET_MS: ${{ inputs.target_ms }}
        run: |
          set -euo pipefail
          python3 scripts/quality/run_portable_cross_os_bench.py \
            --vpp-cli build-benchmark-cli/bin/vpp-cli \
            --output-dir build-benchmark-evidence \
            --runs "$BENCH_RUNS" --target-ms "$BENCH_TARGET_MS" \
            --environment-label "GitHub-hosted $RUNNER_OS $RUNNER_ARCH native runner, V++ C++ VM"

      - name: Benchmark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_TARGET_MS: ${{ inputs.target_ms }}
        run: |
          $candidates = @('build-benchmark-cli/bin/Release/vpp-cli.exe', 'build-benchmark-cli/bin/vpp-cli.exe', 'build-benchmark-cli/Release/vpp-cli.exe')
          $cli = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw 'Cannot find freshly built Windows vpp-cli.exe' }
          python scripts/quality/run_portable_cross_os_bench.py `
            --vpp-cli $cli `
            --output-dir build-benchmark-evidence `
            --runs $env:BENCH_RUNS --target-ms $env:BENCH_TARGET_MS `
            --environment-label "GitHub-hosted $env:RUNNER_OS $env:RUNNER_ARCH native runner, V++ C++ VM"
          if ($LASTEXITCODE -ne 0) { throw "Benchmark failed (exit $LASTEXITCODE)" }

      - name: Upload measurements, source fingerprints, and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-benchmark-${{ matrix.os }}-${{ matrix.os == 'windows-latest' && 'x64' || 'host' }}
          if-no-files-found: warn
          path: build-benchmark-evidence/
