name: C/C++ CI

on:
  push:
    branches: [ "developer" ]
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl

      - name: Configure CMake
        run: cmake -S . -B cmake-build-debug

      - name: Build V++
        run: cmake --build cmake-build-debug

      - name: Run full V++ regression suite
        run: ctest --test-dir cmake-build-debug --output-on-failure --verbose --no-tests=error

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: |
          cmake -S . -B cmake-build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build cmake-build-sanitized
          ctest --test-dir cmake-build-sanitized --output-on-failure --verbose --no-tests=error

  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite CLI
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "SQLite installation failed with exit code $LASTEXITCODE"
          }
          Get-Command sqlite3.exe -ErrorAction Stop | Out-Null

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Windows HTTP server support
        run: cmake --build build --config Release

      - name: Run Windows full V++ regression suite
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose --no-tests=error
