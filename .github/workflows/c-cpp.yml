name: C/C++ CI

on:
  push:
    branches: [ "developer" ]
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl libssl-dev libffi-dev pkg-config

      - name: Configure CMake
        run: cmake -S . -B cmake-build-debug

      - name: Build V++
        run: cmake --build cmake-build-debug

      - name: Run full V++ regression suite
        run: ctest --test-dir cmake-build-debug --output-on-failure --verbose --no-tests=error

      - name: Run RC compiler hardening checks
        shell: bash
        run: |
          set -eu
          export VPP_HOME="$PWD"
          VPP=cmake-build-debug/bin/vpp-cli
          "$VPP" dựng scripts/quality/rc-hardening.vi
          malformed_sources=(scripts/quality/rc-malformed*.vi)
          if [ "${#malformed_sources[@]}" -lt 2 ]; then
            echo "RC malformed corpus is missing" >&2
            exit 1
          fi
          for source in "${malformed_sources[@]}"; do
            if "$VPP" dựng "$source"; then
              echo "Malformed V++ source unexpectedly compiled: $source" >&2
              exit 1
            else
              malformed_exit=$?
              if [ "$malformed_exit" -ne 1 ]; then
                echo "Malformed V++ source returned unexpected exit code $malformed_exit: $source" >&2
                exit 1
              fi
            fi
          done
          for mode in --dump-ast --dump-ir --giải-mã; do
            first="$(mktemp)"
            second="$(mktemp)"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$first"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$second"
            cmp "$first" "$second"
            rm -f "$first" "$second"
          done

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: |
          cmake -S . -B cmake-build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build cmake-build-sanitized
          ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" \
          UBSAN_OPTIONS="halt_on_error=1" \
            ctest --test-dir cmake-build-sanitized --output-on-failure --verbose --no-tests=error

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl clang-tidy lcov libssl-dev libffi-dev pkg-config

      - name: Run clang-tidy baseline
        run: |
          cmake -S . -B build-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=OFF \
            -DVPP_ENABLE_CLANG_TIDY=ON
          cmake --build build-tidy --parallel 2

      - name: Run coverage gate
        env:
          VPP_COVERAGE_MINIMUM: "45"
        run: ./scripts/quality/run-coverage.sh

      - name: Build and run benchmark baseline
        run: |
          cmake -S . -B build-benchmark \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=ON
          cmake --build build-benchmark --target vpp-benchmark-baseline --parallel 2
          ./build-benchmark/bin/vpp-benchmark-baseline

  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite CLI
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "SQLite installation failed with exit code $LASTEXITCODE"
          }
          Get-Command sqlite3.exe -ErrorAction Stop | Out-Null

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Windows HTTP server support
        run: cmake --build build --config Release

      - name: Run Windows full V++ regression suite
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose --no-tests=error

      - name: Run Windows RC compiler hardening checks
        shell: pwsh
        run: |
          $env:VPP_HOME = (Get-Location).Path
          $vpp = "build/bin/Release/vpp-cli.exe"
          & $vpp "dựng" "scripts/quality/rc-hardening.vi"
          if ($LASTEXITCODE -ne 0) { throw "RC hardening source failed to compile" }
          $malformedSources = @(Get-ChildItem "scripts/quality/rc-malformed*.vi" | Sort-Object Name)
          if ($malformedSources.Count -lt 2) { throw "RC malformed corpus is missing" }
          foreach ($source in $malformedSources) {
            & $vpp "dựng" $source.FullName
            $malformedExit = $LASTEXITCODE
            if ($malformedExit -eq 0) { throw "Malformed V++ source unexpectedly compiled: $($source.Name)" }
            if ($malformedExit -ne 1) { throw "Malformed V++ source returned unexpected exit code ${malformedExit}: $($source.Name)" }
          }
          foreach ($mode in @("--dump-ast", "--dump-ir", "--giải-mã")) {
            $first = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".a")
            $second = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".b")
            & $vpp $mode "scripts/quality/rc-hardening.vi" | Set-Content -Encoding utf8 $first
            if ($LASTEXITCODE -ne 0) { throw "RC hardening failed for $mode" }
            & $vpp $mode "scripts/quality/rc-hardening.vi" | Set-Content -Encoding utf8 $second
            if ($LASTEXITCODE -ne 0) { throw "RC hardening failed for $mode" }
            if ((Get-FileHash $first).Hash -ne (Get-FileHash $second).Hash) {
              throw "Non-deterministic compiler output for $mode"
            }
            Remove-Item $first, $second -Force
          }

  macos-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install POSIX FFI dependency
        shell: bash
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build V++
        run: cmake --build build --parallel 2

      - name: Run macOS full V++ regression suite
        run: ctest --test-dir build --output-on-failure --verbose --no-tests=error

      - name: Run macOS RC compiler hardening checks
        shell: bash
        run: |
          set -eu
          export VPP_HOME="$PWD"
          VPP=build/bin/vpp-cli
          "$VPP" dựng scripts/quality/rc-hardening.vi
          malformed_sources=(scripts/quality/rc-malformed*.vi)
          if [ "${#malformed_sources[@]}" -lt 2 ]; then
            echo "RC malformed corpus is missing" >&2
            exit 1
          fi
          for source in "${malformed_sources[@]}"; do
            if "$VPP" dựng "$source"; then
              echo "Malformed V++ source unexpectedly compiled: $source" >&2
              exit 1
            else
              malformed_exit=$?
              if [ "$malformed_exit" -ne 1 ]; then
                echo "Malformed V++ source returned unexpected exit code $malformed_exit: $source" >&2
                exit 1
              fi
            fi
          done
          for mode in --dump-ast --dump-ir --giải-mã; do
            first="$(mktemp)"
            second="$(mktemp)"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$first"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$second"
            cmp "$first" "$second"
            rm -f "$first" "$second"
          done
