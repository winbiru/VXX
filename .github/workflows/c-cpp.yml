name: C/C++ CI

on:
  push:
    branches: [ "developer" ]
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl

      - name: Configure CMake
        run: cmake -S . -B cmake-build-debug

      - name: Build V++
        run: cmake --build cmake-build-debug

      - name: Run tests
        run: ctest --test-dir cmake-build-debug --output-on-failure

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: |
          cmake -S . -B cmake-build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build cmake-build-sanitized
          ctest --test-dir cmake-build-sanitized --output-on-failure

  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTS=OFF

      - name: Build Windows HTTP server support
        run: cmake --build build --config Release

      - name: Run Windows native HTTP server smoke test
        shell: pwsh
        run: |
          $vpp = Get-ChildItem -Path build -Recurse -Filter vpp-cli.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($vpp)) {
            throw "Khong tim thay vpp-cli.exe sau khi build"
          }
          & scripts/windows/test-http-server.ps1 -VppExecutable $vpp
