name: C/C++ CI

on:
  push:
    branches: [ "developer" ]
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # Ubuntu 26.04's static OpenSSL requires libjitterentropy.a at link time.
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl sqlite3 libssl-dev libjitterentropy3-dev libffi-dev pkg-config

      - name: Configure CMake
        run: cmake -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Release

      - name: Build V++
        run: cmake --build cmake-build-debug --parallel 2

      - name: Verify V++ Machine ABI without legacy libffi (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B machine-only-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DVPP_ENABLE_LEGACY_LIBFFI=OFF
          cmake --build machine-only-build --parallel 2 --target vpp-cli
          cmake -D"VPP_CLI=$PWD/machine-only-build/bin/vpp-cli" \
            -D"VPP_ROOT=$PWD" \
            -P scripts/quality/check_machine_no_ffi.cmake

      - name: Install V++ and execute native code compiled from .vi (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/vpp-installed"
          smoke="$RUNNER_TEMP/vpp-native-smoke"
          cmake --install cmake-build-debug --prefix "$prefix"
          cmake -S scripts/quality/installed_native_smoke -B "$smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DVPP_INSTALL_ROOT=$prefix" "-DVPP_SOURCE_ROOT=$PWD" \
            -DVPP_TARGET=x86_64-linux-gnu
          cmake --build "$smoke" --parallel 2
          ctest --test-dir "$smoke" --output-on-failure --no-tests=error

      - name: Verify Linux x86-64 native JIT and interpreter parity
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir cmake-build-debug -R '^vpp-runtime-p0-hardening$' --output-on-failure
          output="$(mktemp)"
          diagnostics="$(mktemp)"
          trap 'rm -f "$output" "$diagnostics"' EXIT
          VPP_HOME="$PWD" VPP_ENABLE_MACHINE_JIT=1 VPP_MACHINE_JIT_STATS=1 \
            cmake-build-debug/bin/vpp-cli src/tests/kiem_tra_machine_jit.vi \
            >"$output" 2>"$diagnostics"
          diff -u src/tests/expected/kiem_tra_machine_jit.expected "$output"
          grep -Eq '^machine-jit: executed [1-9][0-9]* regions / [1-9][0-9]* bytecode instructions as x86-64 machine code$' "$diagnostics"

      - name: Verify Linux x86-64 directory and path syscalls
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir cmake-build-debug --output-on-failure \
            -R '^vpp-(directory-machine-hardening|path-machine-hardening|directory-vpp-fixture)$'
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          VPP_HOME="$PWD" VPP_ENABLE_JIT=1 \
            cmake-build-debug/bin/vpp-cli src/tests/kiem_tra_ffi_thu_muc.vi >"$output"
          diff -u src/tests/expected/kiem_tra_ffi_thu_muc.expected "$output"

      - name: Verify Linux x86-64 V++ machine emitter and ELF64 object linker
        run: ctest --test-dir cmake-build-debug -R '^vpp-native-elf-x86-writer$' --output-on-failure --no-tests=error

      - name: Run full V++ regression suite
        # Installed native smoke verifies the compiler Stage 1 -> Stage 2 -> Stage 3.
        run: ctest --test-dir cmake-build-debug --parallel 2 --output-on-failure --no-tests=error -E '^(vpp-native-compiler-driver|vpp-native-elf-x86-writer)$'

      - name: Preserve native AOT parity evidence on failure (x86-64)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-parity-linux-x86-64
          path: |
            cmake-build-debug/native-aot-vpp-parity/
            cmake-build-debug/Testing/Temporary/LastTest.log
            cmake-build-debug/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

      - name: Run RC compiler hardening checks
        shell: bash
        run: |
          set -eu
          export VPP_HOME="$PWD"
          VPP=cmake-build-debug/bin/vpp-cli
          "$VPP" dựng src/tests/kiem_tra_rc_hardening.vi
          malformed_sources=(src/tests/fixtures/rc_malformed/rc-malformed*.vi)
          if [ "${#malformed_sources[@]}" -lt 2 ]; then
            echo "RC malformed corpus is missing" >&2
            exit 1
          fi
          for source in "${malformed_sources[@]}"; do
            if "$VPP" dựng "$source"; then
              echo "Malformed V++ source unexpectedly compiled: $source" >&2
              exit 1
            else
              malformed_exit=$?
              if [ "$malformed_exit" -ne 1 ]; then
                echo "Malformed V++ source returned unexpected exit code $malformed_exit: $source" >&2
                exit 1
              fi
            fi
          done
          for mode in --dump-ast --dump-ir --giải-mã; do
            first="$(mktemp)"
            second="$(mktemp)"
            "$VPP" "$mode" src/tests/kiem_tra_rc_hardening.vi >"$first"
            "$VPP" "$mode" src/tests/kiem_tra_rc_hardening.vi >"$second"
            cmp "$first" "$second"
            rm -f "$first" "$second"
          done

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: |
          cmake -S . -B cmake-build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build cmake-build-sanitized --parallel 2
          # Release regression and installed smoke cover native self-hosting,
          # linker and machine-code checks without sanitizer instrumentation.
          # Exercise frontend, runtime and integration with ASan/UBSan here.
          ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" \
          UBSAN_OPTIONS="halt_on_error=1" \
            ctest --test-dir cmake-build-sanitized --parallel 2 --output-on-failure --no-tests=error \
              --exclude-regex '^(vpp-native-|vpp-raw-machine-cli-hardening$|vpp-raw-object-host-link$|vpp-compiler-vpp-cli$|vpp-oop-pipeline$|vpp-compiler-ffi-artifact$|vpp-vm-asm($|-selfhost$)|vpp-dns-vpp-mock$|vpp-(benchmark|quantum)-vpp-tool$)'

  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux ARM64 build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl sqlite3 libssl-dev libffi-dev pkg-config

      - name: Build V++ on Linux ARM64
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Verify V++ Machine ABI without legacy libffi (Linux ARM64)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B machine-only-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DVPP_ENABLE_LEGACY_LIBFFI=OFF
          cmake --build machine-only-build --parallel 2 --target vpp-cli
          cmake -D"VPP_CLI=$PWD/machine-only-build/bin/vpp-cli" \
            -D"VPP_ROOT=$PWD" \
            -P scripts/quality/check_machine_no_ffi.cmake

      - name: Install V++ and execute native code compiled from .vi (Linux ARM64)
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/vpp-installed"
          smoke="$RUNNER_TEMP/vpp-native-smoke"
          cmake --install build --prefix "$prefix"
          cmake -S scripts/quality/installed_native_smoke -B "$smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DVPP_INSTALL_ROOT=$prefix" "-DVPP_SOURCE_ROOT=$PWD" \
            -DVPP_TARGET=aarch64-linux-gnu
          cmake --build "$smoke" --parallel 2
          ctest --test-dir "$smoke" --output-on-failure --no-tests=error

      - name: Verify Linux ARM64 machine JIT and interpreter parity
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^vpp-runtime-p0-hardening$' --output-on-failure
          output="$(mktemp)"
          diagnostics="$(mktemp)"
          trap 'rm -f "$output" "$diagnostics"' EXIT
          VPP_HOME="$PWD" VPP_ENABLE_MACHINE_JIT=1 VPP_MACHINE_JIT_STATS=1 \
            build/bin/vpp-cli src/tests/kiem_tra_machine_jit.vi \
            >"$output" 2>"$diagnostics"
          diff -u src/tests/expected/kiem_tra_machine_jit.expected "$output"
          grep -Eq '^machine-jit: executed [1-9][0-9]* regions / [1-9][0-9]* bytecode instructions as AArch64 machine code$' "$diagnostics"

      - name: Verify Linux ARM64 directory and path syscalls
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure \
            -R '^vpp-(directory-machine-hardening|path-machine-hardening|directory-vpp-fixture)$'
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          VPP_HOME="$PWD" VPP_ENABLE_JIT=1 \
            build/bin/vpp-cli src/tests/kiem_tra_ffi_thu_muc.vi >"$output"
          diff -u src/tests/expected/kiem_tra_ffi_thu_muc.expected "$output"

      - name: Run Linux ARM64 regression suite
        # Native AOT bootstrap is covered by installed smoke above.
        run: ctest --test-dir build --parallel 2 --output-on-failure --no-tests=error -E '^(vpp-native-compiler-driver|vpp-native-elf-x86-writer)$'

      - name: Preserve native AOT parity evidence on failure (ARM64)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-parity-linux-arm64
          path: |
            build/native-aot-vpp-parity/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

      - name: Link and run Linux ARM64 native calls
        run: ctest --test-dir build -R '^vpp-native-calls-host-link$' --output-on-failure --no-tests=error

  native-cross-smoke:
    # Cross-compile ELF leaf objects with the host V++ CLI, then verify real
    # target linkage and integer ABI behavior under Linux user-mode QEMU.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install native cross toolchains and emulators
        run: |
          sudo apt-get update
          # Ubuntu 26.04's static libcrypto.a depends on libjitterentropy.a,
          # which is provided by libjitterentropy3-dev (not always pulled in
          # by libssl-dev). Without it, linking the host vpp-cli fails.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev libjitterentropy3-dev libffi-dev pkg-config \
            gcc-powerpc64-linux-gnu gcc-riscv64-linux-gnu \
            gcc-loongarch64-linux-gnu libc6-dev-ppc64-cross \
            libc6-dev-riscv64-cross libc6-dev-loong64-cross \
            qemu-user

      - name: Build V++ code generator
        run: |
          cmake -S . -B build-native-cross -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build-native-cross --target vpp-cli --parallel 2

      - name: Execute PowerPC64 ELFv1 native object smoke
        run: |
          bash scripts/quality/run_cross_native_smoke.sh \
            "$PWD/build-native-cross/bin/vpp-cli" \
            powerpc64-linux-gnu powerpc64-linux-gnu-gcc qemu-ppc64 \
            build-native-cross/smoke-powerpc64

      - name: Execute RISC-V 64 LP64D native object smoke
        run: |
          bash scripts/quality/run_cross_native_smoke.sh \
            "$PWD/build-native-cross/bin/vpp-cli" \
            riscv64-linux-gnu riscv64-linux-gnu-gcc qemu-riscv64 \
            build-native-cross/smoke-riscv64

      - name: Execute LoongArch64 LP64D native object smoke
        run: |
          bash scripts/quality/run_cross_native_smoke.sh \
            "$PWD/build-native-cross/bin/vpp-cli" \
            loongarch64-linux-gnu loongarch64-linux-gnu-gcc qemu-loongarch64 \
            build-native-cross/smoke-loongarch64

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl sqlite3 clang-tidy lcov libssl-dev libjitterentropy3-dev libffi-dev pkg-config

      - name: Run clang-tidy baseline
        run: |
          cmake -S . -B build-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=OFF \
            -DVPP_ENABLE_CLANG_TIDY=ON
          cmake --build build-tidy --parallel 2

      - name: Run coverage gate
        env:
          VPP_COVERAGE_MINIMUM: "45"
        run: ./scripts/quality/run-coverage.sh

      - name: Upload coverage diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-coverage-diagnostics
          if-no-files-found: ignore
          path: |
            build-coverage/ctest.log
            build-coverage/coverage.capture.log
            build-coverage/coverage.filter.log
            build-coverage/coverage.info
            build-coverage/Testing/Temporary/LastTestsFailed.log
            build-coverage/Testing/Temporary/LastTest.log

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libjitterentropy3-dev libffi-dev pkg-config

      - name: Build and exercise benchmark cases
        run: |
          cmake -S . -B build-benchmark-smoke -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=ON
          cmake --build build-benchmark-smoke --parallel 2 --target vpp-benchmark-baseline vpp-cli
          build-benchmark-smoke/bin/vpp-benchmark-baseline --iterations 1 \
            > build-benchmark-smoke/measurements.jsonl

      - name: Validate the statistical comparator written in V++
        run: |
          mkdir -p build-benchmark-smoke/fixtures
          VPP_HOME="$PWD" VPP_BENCHMARK_FIXTURES="$PWD/build-benchmark-smoke/fixtures" \
            build-benchmark-smoke/bin/vpp-cli run --compiler=cpp \
            scripts/quality/test_benchmark_gate.vi

      - name: Check benchmark gate exit codes for every decision
        shell: bash
        run: |
          set -euo pipefail
          for entry in pass:0 fail:1 inconclusive:2 invalid:3; do
            name="${entry%%:*}"
            expected="${entry##*:}"
            actual=0
            VPP_EXEC="$PWD/build-benchmark-smoke/bin/vpp-cli" \
              sh scripts/quality/compare_benchmarks.sh \
              "$PWD/build-benchmark-smoke/fixtures/$name.json" \
              > "$PWD/build-benchmark-smoke/fixtures/$name.out" 2>&1 || actual=$?
            if [ "$actual" -ne "$expected" ]; then
              cat "$PWD/build-benchmark-smoke/fixtures/$name.out"
              echo "unexpected $name benchmark exit code: $actual (expected $expected)" >&2
              exit 1
            fi
          done

      - name: Exercise alternating process collector with identical binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-benchmark-smoke/collector-check
          export VPP_GATE_ROOT="$PWD" VPP_GATE_OUTPUT="$PWD/build-benchmark-smoke/collector-check"
          export VPP_GATE_BASELINE_BIN="$PWD/build-benchmark-smoke/bin/vpp-benchmark-baseline"
          export VPP_GATE_CANDIDATE_BIN="$VPP_GATE_BASELINE_BIN"
          export VPP_GATE_BASELINE_SHA="$GITHUB_SHA" VPP_GATE_CANDIDATE_SHA="$GITHUB_SHA"
          export VPP_GATE_BASELINE_SNAPSHOT_SHA=smoke VPP_GATE_CANDIDATE_SNAPSHOT_SHA=smoke
          export VPP_GATE_BASELINE_BINARY_SHA="smoke" VPP_GATE_CANDIDATE_BINARY_SHA="smoke"
          export VPP_GATE_HARNESS_SHA="smoke" VPP_GATE_HOST="$(uname -sm)"
          export VPP_GATE_COLLECTOR_SHA="smoke" VPP_GATE_COMPARATOR_SHA="smoke"
          export VPP_GATE_CLI_SHA="smoke" VPP_GATE_CPU="smoke" VPP_GATE_OS="$(uname -sr)"
          export VPP_GATE_CASES=vm_verify VPP_GATE_SAMPLES=10 VPP_GATE_TARGET_MS=10
          build-benchmark-smoke/bin/vpp-cli run --compiler=cpp \
            scripts/quality/collect_benchmark_gate.vi
          VPP_EXEC="$PWD/build-benchmark-smoke/bin/vpp-cli" \
            sh scripts/quality/compare_benchmarks.sh \
              "$VPP_GATE_OUTPUT/report.json"

      - name: Upload benchmark smoke measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          if-no-files-found: ignore
          path: |
            build-benchmark-smoke/measurements.jsonl
            build-benchmark-smoke/fixtures/
            build-benchmark-smoke/collector-check/

  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite CLI
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "SQLite installation failed with exit code $LASTEXITCODE"
          }
          Get-Command sqlite3.exe -ErrorAction Stop | Out-Null

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Windows HTTP server support
        run: cmake --build build --config Release

      - name: Install V++ and execute native code compiled from .vi (Windows x64)
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "vpp-installed"
          $smoke = Join-Path $env:RUNNER_TEMP "vpp-native-smoke"
          cmake --install build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "V++ CMake installation failed" }
          cmake -S scripts/quality/installed_native_smoke -B $smoke `
            "-DVPP_INSTALL_ROOT=$prefix" "-DVPP_SOURCE_ROOT=$((Get-Location).Path)" `
            -DVPP_TARGET=x86_64-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Installed V++ native smoke configure failed" }
          cmake --build $smoke --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Installed V++ native object build/link failed" }
          ctest --test-dir $smoke -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Installed V++ native executable failed" }

      - name: Verify Windows x86-64 native JIT and interpreter parity
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R '^vpp-runtime-p0-hardening$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows native JIT hardening failed" }
          $env:VPP_HOME = (Get-Location).Path
          $env:VPP_ENABLE_MACHINE_JIT = "1"
          $env:VPP_MACHINE_JIT_STATS = "1"
          $output = Join-Path $env:RUNNER_TEMP "vpp-native-jit.stdout"
          $diagnostics = Join-Path $env:RUNNER_TEMP "vpp-native-jit.stderr"
          $process = Start-Process -FilePath (Resolve-Path "build/bin/Release/vpp-cli.exe").Path `
            -ArgumentList @("src/tests/kiem_tra_machine_jit.vi") `
            -WorkingDirectory (Get-Location).Path `
            -RedirectStandardOutput $output -RedirectStandardError $diagnostics `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows machine JIT exited with $($process.ExitCode): $([IO.File]::ReadAllText($diagnostics))"
          }
          $expected = [IO.File]::ReadAllText((Resolve-Path "src/tests/expected/kiem_tra_machine_jit.expected").Path)
          $actual = [IO.File]::ReadAllText($output)
          if ($expected.Replace("`r`n", "`n") -cne $actual.Replace("`r`n", "`n")) {
            throw "Windows machine JIT output differs from interpreter golden fixture"
          }
          $stats = [IO.File]::ReadAllText($diagnostics)
          if ($stats -notmatch 'machine-jit: executed [1-9][0-9]* regions / [1-9][0-9]* bytecode instructions as x86-64 machine code') {
            throw "Windows x86-64 native JIT did not execute machine code: $stats"
          }

      - name: Run Windows full V++ regression suite
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --parallel 2 --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows V++ regression suite failed" }

      - name: Preserve Windows CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-windows-diagnostics
          path: build/Testing/Temporary/
          if-no-files-found: ignore

      - name: Link and run Windows x86-64 native COFF calls
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R '^vpp-native-calls-host-link$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows native COFF calls failed to link or execute" }

      - name: Run Windows RC compiler hardening checks
        shell: pwsh
        run: |
          $env:VPP_HOME = (Get-Location).Path
          $vpp = "build/bin/Release/vpp-cli.exe"
          & $vpp "dựng" "src/tests/kiem_tra_rc_hardening.vi"
          if ($LASTEXITCODE -ne 0) { throw "RC hardening source failed to compile" }
          $malformedSources = @(Get-ChildItem "src/tests/fixtures/rc_malformed/rc-malformed*.vi" | Sort-Object Name)
          if ($malformedSources.Count -lt 2) { throw "RC malformed corpus is missing" }
          foreach ($source in $malformedSources) {
            & $vpp "dựng" $source.FullName
            $malformedExit = $LASTEXITCODE
            if ($malformedExit -eq 0) { throw "Malformed V++ source unexpectedly compiled: $($source.Name)" }
            if ($malformedExit -ne 1) { throw "Malformed V++ source returned unexpected exit code ${malformedExit}: $($source.Name)" }
          }
          foreach ($mode in @("--dump-ast", "--dump-ir", "--giải-mã")) {
            $first = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".a")
            $second = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".b")
            & $vpp $mode "src/tests/kiem_tra_rc_hardening.vi" | Set-Content -Encoding utf8 $first
            if ($LASTEXITCODE -ne 0) { throw "RC hardening failed for $mode" }
            & $vpp $mode "src/tests/kiem_tra_rc_hardening.vi" | Set-Content -Encoding utf8 $second
            if ($LASTEXITCODE -ne 0) { throw "RC hardening failed for $mode" }
            if ((Get-FileHash $first).Hash -ne (Get-FileHash $second).Hash) {
              throw "Non-deterministic compiler output for $mode"
            }
            Remove-Item $first, $second -Force
          }

  macos-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install POSIX FFI dependency
        shell: bash
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build V++
        run: cmake --build build --parallel 2

      - name: Install V++ and execute native code compiled from .vi (macOS)
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/vpp-installed"
          smoke="$RUNNER_TEMP/vpp-native-smoke"
          case "$(uname -m)" in
            arm64) native_target=aarch64-apple-darwin ;;
            x86_64) native_target=x86_64-apple-darwin ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          cmake --install build --prefix "$prefix"
          cmake -S scripts/quality/installed_native_smoke -B "$smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DVPP_INSTALL_ROOT=$prefix" "-DVPP_SOURCE_ROOT=$PWD" \
            "-DVPP_TARGET=$native_target"
          cmake --build "$smoke" --parallel 2
          ctest --test-dir "$smoke" --output-on-failure --no-tests=error
          # The installed-native-aot-bootstrap-three-stage test already
          # compiles and runs nativeaotprint.vi with the self-hosted Stage 3
          # compiler. The legacy --emit-exe-selfhost replay used another
          # frontend, duplicated this smoke check and could time out in CI.

      - name: Run macOS full V++ regression suite
        # Installed smoke verifies full-language native Stage 1 -> Stage 2 -> Stage 3.
        run: ctest --test-dir build --parallel 2 --output-on-failure --no-tests=error -E '^vpp-native-compiler-driver$'

      - name: Run macOS RC compiler hardening checks
        shell: bash
        run: |
          set -eu
          export VPP_HOME="$PWD"
          VPP=build/bin/vpp-cli
          "$VPP" dựng src/tests/kiem_tra_rc_hardening.vi
          malformed_sources=(src/tests/fixtures/rc_malformed/rc-malformed*.vi)
          if [ "${#malformed_sources[@]}" -lt 2 ]; then
            echo "RC malformed corpus is missing" >&2
            exit 1
          fi
          for source in "${malformed_sources[@]}"; do
            if "$VPP" dựng "$source"; then
              echo "Malformed V++ source unexpectedly compiled: $source" >&2
              exit 1
            else
              malformed_exit=$?
              if [ "$malformed_exit" -ne 1 ]; then
                echo "Malformed V++ source returned unexpected exit code $malformed_exit: $source" >&2
                exit 1
              fi
            fi
          done
          for mode in --dump-ast --dump-ir --giải-mã; do
            first="$(mktemp)"
            second="$(mktemp)"
            "$VPP" "$mode" src/tests/kiem_tra_rc_hardening.vi >"$first"
            "$VPP" "$mode" src/tests/kiem_tra_rc_hardening.vi >"$second"
            cmp "$first" "$second"
            rm -f "$first" "$second"
          done
