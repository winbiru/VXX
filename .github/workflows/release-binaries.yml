name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: vpp-linux-x64.tar.gz
          - os: macos-latest
            asset_name: vpp-macos.tar.gz
          - os: windows-latest
            asset_name: vpp-windows-x64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux crypto dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build V++ and RC test gate
        run: cmake --build build --config Release

      - name: Verify build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          ctest --test-dir build --output-on-failure --no-tests=error
          python3 scripts/quality/rc-hardening.py --vpp build/bin/vpp-cli

      - name: Verify build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          python scripts/quality/rc-hardening.py --vpp build/bin/Release/vpp-cli.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          BIN_PATH=""
          for p in \
            "build/bin/vpp-cli" \
            "build/Release/vpp-cli" \
            "build/vpp-cli"; do
            if [ -f "$p" ]; then BIN_PATH="$p"; break; fi
          done

          if [ -z "$BIN_PATH" ]; then
            echo "Khong tim thay file vpp-cli sau khi build" >&2
            exit 1
          fi

          mkdir -p dist
          cp "$BIN_PATH" dist/vpp
          chmod +x dist/vpp
          cp -R gói dist/gói
          cp -R templates dist/templates
          cp -R examples dist/examples
          cp scripts/unix/install-vpp.sh dist/install-vpp.sh
          chmod +x dist/install-vpp.sh
          tar -czf "${{ matrix.asset_name }}" -C dist vpp gói templates examples install-vpp.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/Release/vpp-cli.exe",
            "build/Release/vpp-cli.exe",
            "build/vpp-cli.exe"
          )

          $bin = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $bin = $p; break }
          }

          if (-not $bin) {
            Write-Error "Khong tim thay file vpp-cli.exe sau khi build"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bin dist/vpp.exe
          Copy-Item gói dist/gói -Recurse
          Copy-Item templates dist/templates -Recurse
          Copy-Item examples dist/examples -Recurse
          Copy-Item scripts/windows/install-vpp.ps1 dist/install-vpp.ps1
          Copy-Item scripts/windows/install-vpp.cmd dist/install-vpp.cmd
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Verify packaged artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          EXTRACT_DIR="$VERIFY_ROOT/archive"
          INSTALL_DIR="$VERIFY_ROOT/install"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "${{ matrix.asset_name }}" -C "$EXTRACT_DIR"
          VPP_INSTALL_DIR="$INSTALL_DIR" VPP_SKIP_PROFILE=1 "$EXTRACT_DIR/install-vpp.sh"
          touch "$INSTALL_DIR/gói/.release-smoke-stale"
          VPP_INSTALL_DIR="$INSTALL_DIR" VPP_SKIP_PROFILE=1 "$EXTRACT_DIR/install-vpp.sh"
          test ! -e "$INSTALL_DIR/gói/.release-smoke-stale"
          VPP_HOME="$INSTALL_DIR" "$INSTALL_DIR/vpp" dựng "$INSTALL_DIR/examples/quan-ly-kho-api/src/main.vi"
          (
            cd "$INSTALL_DIR/examples/quan-ly-kho-api"
            VPP_EXEC="$INSTALL_DIR/vpp" python3 scripts/verify_http.py
          )

      - name: Verify packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "vpp-release-verify"
          $extractDir = Join-Path $verifyRoot "archive"
          $installDir = Join-Path $verifyRoot "install"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path "${{ matrix.asset_name }}" -DestinationPath $extractDir -Force
          $installer = Join-Path $extractDir "install-vpp.ps1"
          & $installer -InstallDir $installDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Artifact installation failed" }
          New-Item -ItemType File -Force -Path (Join-Path $installDir "gói/.release-smoke-stale") | Out-Null
          & $installer -InstallDir $installDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Artifact update installation failed" }
          if (Test-Path (Join-Path $installDir "gói/.release-smoke-stale")) {
            throw "Installer left stale managed files behind"
          }
          $vpp = Join-Path $installDir "vpp.exe"
          $sample = Join-Path $installDir "examples/quan-ly-kho-api"
          $env:VPP_HOME = $installDir
          & $vpp "dựng" (Join-Path $sample "src/main.vi")
          if ($LASTEXITCODE -ne 0) { throw "Artifact build verification failed" }
          Push-Location $sample
          try {
            $env:VPP_EXEC = $vpp
            python scripts/verify_http.py
            if ($LASTEXITCODE -ne 0) { throw "Artifact HTTP verification failed" }
          }
          finally {
            Pop-Location
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
