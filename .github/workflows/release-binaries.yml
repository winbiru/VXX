name: Release VDK and Runtime

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: vpp-linux-x64.tar.gz
          - os: macos-latest
            asset_name: vpp-macos.tar.gz
          - os: windows-latest
            asset_name: vpp-windows-x64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux crypto dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install Windows SQLite CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "SQLite installation failed with exit code $LASTEXITCODE"
          }
          Get-Command sqlite3.exe -ErrorAction Stop | Out-Null

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build V++ and RC test gate
        run: cmake --build build --config Release

      - name: Verify build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          ctest --test-dir build --output-on-failure --no-tests=error
          export VPP_HOME="$PWD"
          VPP=build/bin/vpp-cli
          "$VPP" dựng scripts/quality/rc-hardening.vi
          malformed_sources=(scripts/quality/rc-malformed*.vi)
          if [ "${#malformed_sources[@]}" -lt 2 ]; then
            echo "RC malformed corpus is missing" >&2
            exit 1
          fi
          for source in "${malformed_sources[@]}"; do
            if "$VPP" dựng "$source"; then
              echo "Malformed V++ source unexpectedly compiled: $source" >&2
              exit 1
            else
              malformed_exit=$?
              if [ "$malformed_exit" -ne 1 ]; then
                echo "Malformed V++ source returned unexpected exit code $malformed_exit: $source" >&2
                exit 1
              fi
            fi
          done
          for mode in --dump-ast --dump-ir --giải-mã; do
            first="$(mktemp)"
            second="$(mktemp)"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$first"
            "$VPP" "$mode" scripts/quality/rc-hardening.vi >"$second"
            cmp "$first" "$second"
            rm -f "$first" "$second"
          done

      - name: Verify build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows CTest failed; release packaging stopped" }
          $env:VPP_HOME = (Get-Location).Path
          $vpp = "build/bin/Release/vpp-cli.exe"
          & $vpp "dựng" "scripts/quality/rc-hardening.vi"
          if ($LASTEXITCODE -ne 0) { throw "Windows RC hardening source failed to compile" }
          $malformedSources = @(Get-ChildItem "scripts/quality/rc-malformed*.vi" | Sort-Object Name)
          if ($malformedSources.Count -lt 2) { throw "RC malformed corpus is missing" }
          foreach ($source in $malformedSources) {
            & $vpp "dựng" $source.FullName
            $malformedExit = $LASTEXITCODE
            if ($malformedExit -eq 0) { throw "Malformed V++ source unexpectedly compiled: $($source.Name)" }
            if ($malformedExit -ne 1) { throw "Malformed V++ source returned unexpected exit code ${malformedExit}: $($source.Name)" }
          }
          foreach ($mode in @("--dump-ast", "--dump-ir", "--giải-mã")) {
            $first = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".a")
            $second = Join-Path $env:RUNNER_TEMP ("vpp-rc-" + [guid]::NewGuid() + ".b")
            & $vpp $mode "scripts/quality/rc-hardening.vi" | Set-Content -Encoding utf8 $first
            if ($LASTEXITCODE -ne 0) { throw "Windows RC hardening failed for $mode" }
            & $vpp $mode "scripts/quality/rc-hardening.vi" | Set-Content -Encoding utf8 $second
            if ($LASTEXITCODE -ne 0) { throw "Windows RC hardening failed for $mode" }
            if ((Get-FileHash $first).Hash -ne (Get-FileHash $second).Hash) {
              throw "Non-deterministic compiler output for $mode"
            }
            Remove-Item $first, $second -Force
          }

      - name: Package VDK
        run: cpack --config build/CPackConfig.cmake -C Release -B build/vdk-artifacts

      - name: Verify VDK archive
        id: vdk
        run: python scripts/quality/verify-vdk.py --build-dir build

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          BIN_PATH=""
          for p in \
            "build/bin/vpp-cli" \
            "build/Release/vpp-cli" \
            "build/vpp-cli"; do
            if [ -f "$p" ]; then BIN_PATH="$p"; break; fi
          done

          if [ -z "$BIN_PATH" ]; then
            echo "Khong tim thay file vpp-cli sau khi build" >&2
            exit 1
          fi

          mkdir -p dist
          cp "$BIN_PATH" dist/vpp
          chmod +x dist/vpp
          cp -R gói dist/gói
          cp -R templates dist/templates
          cp -R examples dist/examples
          find dist/examples -type d -name .vpp -prune -exec rm -rf {} +
          cp scripts/unix/install-vpp.sh dist/install-vpp.sh
          cp scripts/unix/uninstall-vpp.sh dist/uninstall-vpp.sh
          chmod +x dist/install-vpp.sh
          chmod +x dist/uninstall-vpp.sh
          tar -czf "${{ matrix.asset_name }}" -C dist vpp gói templates examples install-vpp.sh uninstall-vpp.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/Release/vpp-cli.exe",
            "build/Release/vpp-cli.exe",
            "build/vpp-cli.exe"
          )

          $bin = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $bin = $p; break }
          }

          if (-not $bin) {
            Write-Error "Khong tim thay file vpp-cli.exe sau khi build"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bin dist/vpp.exe
          Copy-Item gói dist/gói -Recurse
          Copy-Item templates dist/templates -Recurse
          Copy-Item examples dist/examples -Recurse
          Get-ChildItem dist/examples -Directory -Filter .vpp -Recurse -Force | Remove-Item -Recurse -Force
          Copy-Item scripts/windows/install-vpp.ps1 dist/install-vpp.ps1
          Copy-Item scripts/windows/install-vpp.cmd dist/install-vpp.cmd
          Copy-Item scripts/windows/uninstall-vpp.ps1 dist/uninstall-vpp.ps1
          Copy-Item scripts/windows/vpp-uninstall.cmd dist/vpp-uninstall.cmd
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Verify packaged artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          EXTRACT_DIR="$VERIFY_ROOT/archive"
          INSTALL_DIR="$VERIFY_ROOT/install"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "${{ matrix.asset_name }}" -C "$EXTRACT_DIR"
          if find "$EXTRACT_DIR/examples" -type d -name .vpp -print -quit | grep -q .; then
            echo "Release artifact unexpectedly contains .vpp cache" >&2
            exit 1
          fi
          VPP_INSTALL_DIR="$INSTALL_DIR" VPP_SKIP_PROFILE=1 "$EXTRACT_DIR/install-vpp.sh"
          touch "$INSTALL_DIR/gói/.release-smoke-stale"
          VPP_INSTALL_DIR="$INSTALL_DIR" VPP_SKIP_PROFILE=1 "$EXTRACT_DIR/install-vpp.sh"
          test ! -e "$INSTALL_DIR/gói/.release-smoke-stale"
          test -x "$INSTALL_DIR/uninstall-vpp.sh"
          "$INSTALL_DIR/vpp" phiên bản
          "$INSTALL_DIR/vpp" chẩn đoán
          if [ "${{ runner.os }}" = "Linux" ]; then
            if ldd "$INSTALL_DIR/vpp" | grep -E 'lib(ssl|crypto)\.so' >/dev/null; then
              echo "Linux release still depends on external OpenSSL shared libraries" >&2
              exit 1
            fi
          fi
          VPP_HOME="$INSTALL_DIR" "$INSTALL_DIR/vpp" dựng "$INSTALL_DIR/examples/quan-ly-kho-api/src/chính.vi"
          (
            cd "$INSTALL_DIR/examples/quan-ly-kho-api"
            export VPP_HOME="$INSTALL_DIR"
            export VPP_WAREHOUSE_PORT=18932
            "$INSTALL_DIR/vpp" chạy src/chính.vi >"$VERIFY_ROOT/warehouse-server.log" 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

            if ! "$INSTALL_DIR/vpp" chạy scripts/verify_http.vi; then
              cat "$VERIFY_ROOT/warehouse-server.log" >&2
              exit 1
            fi
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            trap - EXIT
          )

          PROFILE_HOME="$VERIFY_ROOT/home"
          PROFILE_INSTALL="$VERIFY_ROOT/profile-install"
          mkdir -p "$PROFILE_HOME"
          HOME="$PROFILE_HOME" SHELL=/bin/bash VPP_INSTALL_DIR="$PROFILE_INSTALL" "$EXTRACT_DIR/install-vpp.sh"
          HOME="$PROFILE_HOME" PROFILE_INSTALL="$PROFILE_INSTALL" /bin/bash -c '
            set -eu
            . "$HOME/.bash_profile"
            test "$VPP_HOME" = "$PROFILE_INSTALL"
            test "$(command -v vpp)" = "$PROFILE_INSTALL/vpp"
            case "${LANG:-}" in *UTF-8*|*utf8*) ;; *) echo "Installer did not persist a UTF-8 LANG" >&2; exit 1 ;; esac
            case "${LC_CTYPE:-}" in *UTF-8*|*utf8*) ;; *) echo "Installer did not persist a UTF-8 LC_CTYPE" >&2; exit 1 ;; esac
            vpp phiên bản >/dev/null
          '
          printf 'in 42;\n' > "$PROFILE_INSTALL/my-project.vi"
          HOME="$PROFILE_HOME" SHELL=/bin/bash PATH="$PROFILE_INSTALL:$PATH" VPP_HOME="$PROFILE_INSTALL" \
            "$PROFILE_INSTALL/vpp" gỡ cài đặt
          test -f "$PROFILE_INSTALL/my-project.vi"
          test ! -e "$PROFILE_INSTALL/vpp"
          test ! -e "$PROFILE_INSTALL/gói"
          test ! -e "$PROFILE_INSTALL/uninstall-vpp.sh"
          test -z "$(grep -F 'VPP installer' "$PROFILE_HOME/.bash_profile" || true)"

      - name: Verify packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "vpp-release-verify"
          $extractDir = Join-Path $verifyRoot "archive"
          $installDir = Join-Path $verifyRoot "install"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path "${{ matrix.asset_name }}" -DestinationPath $extractDir -Force
          $packagedCache = Get-ChildItem (Join-Path $extractDir "examples") -Directory -Filter .vpp -Recurse -Force | Select-Object -First 1
          if ($packagedCache) { throw "Release artifact unexpectedly contains .vpp cache: $($packagedCache.FullName)" }
          $installer = Join-Path $extractDir "install-vpp.ps1"
          $launcher = Join-Path $extractDir "install-vpp.cmd"
          & powershell.exe -NoProfile -ExecutionPolicy Restricted -Command "& '$launcher' -InstallDir '$installDir' -NoPathUpdate; exit `$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "Artifact installation failed" }
          if (-not (Test-Path (Join-Path $installDir "gói"))) { throw "Vietnamese stdlib directory missing" }
          $vpp = Join-Path $installDir "vpp.exe"
          $dependencyTool = $null
          $dependencyToolKind = $null
          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbinCommand) {
            $dependencyTool = $dumpbinCommand.Source
            $dependencyToolKind = "dumpbin"
          }
          else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
              if ($vsInstall) {
                $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC/Tools/MSVC") -Filter dumpbin.exe -File -Recurse |
                  Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1 -ExpandProperty FullName
                if ($dumpbin) {
                  $dependencyTool = $dumpbin
                  $dependencyToolKind = "dumpbin"
                }
              }
            }
          }
          if (-not $dependencyTool) {
            $llvmObjdump = Get-Command llvm-objdump.exe -ErrorAction SilentlyContinue
            if ($llvmObjdump) {
              $dependencyTool = $llvmObjdump.Source
              $dependencyToolKind = "objdump"
            }
          }
          if (-not $dependencyTool) {
            $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue
            if ($objdump) {
              $dependencyTool = $objdump.Source
              $dependencyToolKind = "objdump"
            }
          }
          if (-not $dependencyTool) {
            throw "Cannot inspect vpp.exe dependencies: dumpbin.exe, llvm-objdump.exe, and objdump.exe are all unavailable"
          }
          if ($dependencyToolKind -eq "dumpbin") {
            $dependencyOutput = & $dependencyTool /dependents $vpp
          }
          else {
            $dependencyOutput = & $dependencyTool -p $vpp
          }
          if ($LASTEXITCODE -ne 0) { throw "Dependency inspection failed with $dependencyTool" }
          $dependencyText = $dependencyOutput | Out-String
          $dllNames = @(
            [regex]::Matches($dependencyText, '(?im)\b[A-Za-z0-9][A-Za-z0-9._+-]*\.dll\b') |
              ForEach-Object { $_.Value.ToLowerInvariant() } |
              Sort-Object -Unique
          )
          if ($dllNames.Count -eq 0) {
            throw "Dependency inspection produced no DLL names with $dependencyTool"
          }
          foreach ($dllName in $dllNames) {
            foreach ($forbiddenPrefix in @("vcruntime", "msvcp", "ucrtbase", "api-ms-win-crt", "vpp-")) {
              if ($dllName.StartsWith($forbiddenPrefix)) {
                throw "Release depends on unbundled runtime DLL: $dllName"
              }
            }
          }
          $env:VPP_HOME = $installDir
          & $vpp "chạy" "scripts/quality/windows-install-smoke.vi"
          if ($LASTEXITCODE -ne 0) { throw "Windows .vi artifact smoke failed" }
          New-Item -ItemType File -Force -Path (Join-Path $installDir "gói/.release-smoke-stale") | Out-Null
          & $installer -InstallDir $installDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Artifact update installation failed" }
          if (Test-Path (Join-Path $installDir "gói/.release-smoke-stale")) {
            throw "Installer left stale managed files behind"
          }
          $vpp = Join-Path $installDir "vpp.exe"
          $sample = Join-Path $installDir "examples/quan-ly-kho-api"
          $env:VPP_HOME = $installDir
          & $vpp "dựng" (Join-Path $sample "src/chính.vi")
          if ($LASTEXITCODE -ne 0) { throw "Artifact build verification failed" }
          Push-Location $sample
          try {
            $env:VPP_WAREHOUSE_PORT = "18932"
            $serverOut = Join-Path $verifyRoot "warehouse-server.out"
            $serverErr = Join-Path $verifyRoot "warehouse-server.err"
            $server = Start-Process -FilePath $vpp -ArgumentList @("chạy", "src/chính.vi") -WorkingDirectory $sample -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru -NoNewWindow
            try {
              & $vpp "chạy" "scripts/verify_http.vi"
              if ($LASTEXITCODE -ne 0) { throw "Artifact .vi HTTP verification failed" }
            }
            finally {
              if (-not $server.HasExited) {
                Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              }
              $server.WaitForExit()
            }
          }
          finally {
            Pop-Location
          }
          $uninstallDir = Join-Path $verifyRoot "uninstall-smoke"
          & $installer -InstallDir $uninstallDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "Uninstall smoke installation failed" }
          Set-Content -Encoding utf8 -NoNewline -Path (Join-Path $uninstallDir "my-project.vi") -Value "in 42;"
          & (Join-Path $uninstallDir "vpp.exe") "gỡ" "cài" "đặt"
          if ($LASTEXITCODE -ne 0) { throw "Uninstall smoke failed" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path (Join-Path $uninstallDir "vpp.exe")) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 100
          }
          if (-not (Test-Path (Join-Path $uninstallDir "my-project.vi"))) { throw "Uninstall deleted user project" }
          if (Test-Path (Join-Path $uninstallDir "vpp.exe")) { throw "Uninstall left vpp.exe" }

          # Verify the normal end-user path: installer persists UTF-8 configuration
          # for both Windows PowerShell and PowerShell 7, and uninstall removes it.
          $profileInstallDir = Join-Path $verifyRoot "profile-install"
          & $installer -InstallDir $profileInstallDir
          if ($LASTEXITCODE -ne 0) { throw "Profile installation smoke failed" }
          $documents = [Environment]::GetFolderPath('MyDocuments')
          $profilePaths = @(
            $PROFILE.CurrentUserAllHosts,
            (Join-Path $documents "WindowsPowerShell\profile.ps1"),
            (Join-Path $documents "PowerShell\profile.ps1")
          ) | Where-Object { $_ } | Select-Object -Unique
          foreach ($profilePath in $profilePaths) {
            if (-not (Test-Path -LiteralPath $profilePath)) { throw "PowerShell profile was not created: $profilePath" }
            if (-not (Select-String -LiteralPath $profilePath -SimpleMatch '# >>> V++ UTF-8 >>>' -Quiet)) {
              throw "V++ UTF-8 profile marker missing: $profilePath"
            }
          }
          & (Join-Path $profileInstallDir "vpp.exe") "gỡ" "cài" "đặt"
          if ($LASTEXITCODE -ne 0) { throw "Profile uninstall smoke failed" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path (Join-Path $profileInstallDir "vpp.exe")) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 100
          }
          foreach ($profilePath in $profilePaths) {
            if ((Test-Path -LiteralPath $profilePath) -and
                (Select-String -LiteralPath $profilePath -SimpleMatch '# >>> V++ UTF-8 >>>' -Quiet)) {
              throw "V++ UTF-8 profile marker was not removed: $profilePath"
            }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload VDK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vdk.outputs.name }}
          path: |
            ${{ steps.vdk.outputs.archive }}
            ${{ steps.vdk.outputs.checksum }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.asset_name }}
            ${{ steps.vdk.outputs.archive }}
            ${{ steps.vdk.outputs.checksum }}
