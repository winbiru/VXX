name: V++ native CI
on:
  push:
    branches: [main, developer, 'developer-stage-*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # V++ sources, paths, expected output and diagnostics are UTF-8 on every OS.
  # Keep Python and its child processes on the same encoding on Windows too.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  tls-linux:
    name: TLS provider - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Verify identity, encrypted I/O and cleanup across the socket ABI
        run: python3 scripts/quality/check_vm_native_tls_linux.py
  tls-windows:
    name: TLS provider - Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-python
      - name: Verify Schannel identity, encrypted I/O and cleanup across Winsock
        shell: msys2 {0}
        run: python scripts/quality/check_vm_native_tls_windows.py
  graphics-linux:
    name: Linux x64 - SDL2, OpenGL and Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics SDK and software drivers
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb xauth
      - name: Build native graphics helpers
        run: |
          cmake -S scripts/graphics -B build-graphics
          cmake --build build-graphics
      - name: Render window and verify GPU API readback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build-graphics --output-on-failure
  graphics-windows:
    name: Windows x64 - SDL2 events and Vulkan link
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
      - name: Build graphics helpers and test SDL software window
        shell: msys2 {0}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          cmake -S scripts/graphics -B build-graphics -G Ninja
          cmake --build build-graphics
          ctest --test-dir build-graphics -R '^graphics-sdl-(version|window)$' --output-on-failure
  posix-worker-machine:
    name: OS worker - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check OS threads, isolated arenas and worker lifecycle
        run: python3 scripts/quality/check_worker_machine.py
  macos-i32:
    name: macOS ARM64 - i32 source bootstrap
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned seeds and build i32 compiler and bootstrap runtime
        run: |
          (cd bootstrap/macos-arm64 && shasum -a 256 -c SHA256SUMS)
          export VPP_HOME="$GITHUB_WORKSPACE" VPP_NATIVE_NO_CACHE=1 VPP_NATIVE_MACHO_REL_LINK=0
          bash scripts/build-vpp-aot-runtime.sh "$RUNNER_TEMP/macos-i32" "$GITHUB_WORKSPACE/bootstrap/macos-arm64/vpp-i32"
          codesign --verify "$RUNNER_TEMP/macos-i32/vpp-i32"
      - name: Check i32 relative module paths
        run: |
          export VPP_HOME="$GITHUB_WORKSPACE" VPP_NATIVE_NO_CACHE=1
          "$RUNNER_TEMP/macos-i32/vpp-i32" check 'gói/biên dịch/bản địa/bộ biên dịch.vi'
          "$RUNNER_TEMP/macos-i32/vpp-i32" check './gói/biên dịch/bản địa/bộ biên dịch.vi'
      - name: Check ELF and COFF symbol index regression
        run: |
          export VPP_HOME="$GITHUB_WORKSPACE" VPP_NATIVE_NO_CACHE=1
          out="$RUNNER_TEMP/symbol-index"
          mkdir -p "$out"
          "$RUNNER_TEMP/macos-i32/vpp-i32" build "$GITHUB_WORKSPACE/scripts/test/fixtures/native_object_symbol_index.vi" -o "$out/probe"
          "$out/probe" "$out/probe.elf.o" "$out/probe.coff.obj"
          python3 scripts/quality/check_native_object_symbol_index.py "$out/probe.elf.o" "$out/probe.coff.obj"
      - name: Package the rebuilt i32 compiler and runtime
        run: |
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/macos-i32" -czf "$RUNNER_TEMP/vpp-macos-arm64-i32.tar.gz" vpp-i32 runtime.o platform.o dynamic-bridge.o
      - uses: actions/upload-artifact@v4
        with:
          name: macos-i32-selfhost
          path: ${{ runner.temp }}/vpp-macos-arm64-i32.tar.gz
          if-no-files-found: error
  macos-full:
    name: macOS ARM64 - full dynamic compiler
    needs: macos-i32
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-i32-selfhost
          path: ${{ runner.temp }}/macos-i32-artifact
      - name: Prepare runtime
        run: |
          mkdir -p "$RUNNER_TEMP/macos-i32-prefix"
          tar -C "$RUNNER_TEMP/macos-i32-prefix" -xzf "$RUNNER_TEMP/macos-i32-artifact/vpp-macos-arm64-i32.tar.gz"
          cmake -S . -B build-pure-vpp -DVPP_PREBUILT_I32_RUNTIME="$RUNNER_TEMP/macos-i32-prefix" -DVPP_CI_PINNED_FULL_STAGE1=ON
      - name: Bootstrap full compiler (Stage 1)
        run: |
          cmake --build build-pure-vpp --parallel
          bash scripts/quality/check_macos_full_bootstrap.sh --phase stage1 "$GITHUB_WORKSPACE/build-pure-vpp" "$RUNNER_TEMP/macos-full"
      - name: Self-host Stage 2
        run: bash scripts/quality/check_macos_full_bootstrap.sh --phase stage2 "$GITHUB_WORKSPACE/build-pure-vpp" "$RUNNER_TEMP/macos-full"
      - name: Self-host Stage 3
        run: bash scripts/quality/check_macos_full_bootstrap.sh --phase stage3 "$GITHUB_WORKSPACE/build-pure-vpp" "$RUNNER_TEMP/macos-full"
      - name: Verify binary convergence
        run: bash scripts/quality/check_macos_full_bootstrap.sh --phase convergence "$GITHUB_WORKSPACE/build-pure-vpp" "$RUNNER_TEMP/macos-full"
      - name: Run tests
        run: |
          bash scripts/quality/check_macos_full_bootstrap.sh --phase test "$GITHUB_WORKSPACE/build-pure-vpp" "$RUNNER_TEMP/macos-full"
          install -m 755 "$RUNNER_TEMP/macos-full/vpp-native-stage3" build-pure-vpp/bin/vpp-native
          cmake --build build-pure-vpp --target vpp-jit
          ctest --test-dir build-pure-vpp -L smoke -E "^vpp-native-smoke$" --output-on-failure
      - name: Verify V++ X.509 paths and fragmented TLS 1.3 tickets
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          ctest --test-dir build-pure-vpp -R '^vpp-tls-' --output-on-failure -j 4
          python3 -m venv "$RUNNER_TEMP/tls-venv"
          "$RUNNER_TEMP/tls-venv/bin/python" -m pip install cryptography
          VPP_TLS_TEST_BINARY="$GITHUB_WORKSPACE/build-pure-vpp/bin/vpp" \
            "$RUNNER_TEMP/tls-venv/bin/python" scripts/quality/check_vm_tls_vpp_interop.py
      - name: Package and test installed compiler
        run: |
          cmake --install build-pure-vpp --prefix "$RUNNER_TEMP/vpp-install"
          "$RUNNER_TEMP/vpp-install/bin/vpp" --version
          "$RUNNER_TEMP/vpp-install/bin/vpp" vm-build "$RUNNER_TEMP/vpp-install/share/vpp/gói/máy ảo/nhà cung cấp DNS.vi" -o "$RUNNER_TEMP/vpp-install/bin/dns-provider.vmb"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/vpp-install" -czf "$RUNNER_TEMP/vpp-macos-arm64.tar.gz" .
          mkdir -p "$RUNNER_TEMP/vpp-extracted"
          tar -C "$RUNNER_TEMP/vpp-extracted" -xzf "$RUNNER_TEMP/vpp-macos-arm64.tar.gz"
          printf 'hàm chính() { in 42; }\n' > "$RUNNER_TEMP/probe.vi"
          result=$("$RUNNER_TEMP/vpp-extracted/bin/vpp" run "$RUNNER_TEMP/probe.vi")
          test "$result" = 42
          test "$(PATH= "$RUNNER_TEMP/vpp-extracted/bin/vpp-jit" "$RUNNER_TEMP/probe.vi")" = 42
          test "$("$RUNNER_TEMP/vpp-extracted/bin/vpp" jit "$RUNNER_TEMP/probe.vi")" = 42
          python3 scripts/quality/check_jit_cli.py "$RUNNER_TEMP/vpp-extracted/bin/vpp-jit"
          python3 scripts/quality/check_jit_dynamic.py "$RUNNER_TEMP/vpp-extracted/bin/vpp-jit" "$RUNNER_TEMP/vpp-extracted/share/vpp"
          python3 scripts/quality/run_native_regression.py --suite host --backend aot --compiler "$RUNNER_TEMP/vpp-extracted/bin/vpp" --timeout 900 --logs "$RUNNER_TEMP/host-regression"
      - name: Check Linux cross emitter
        run: |
          probe="$RUNNER_TEMP/probe.vi"
          build-pure-vpp/bin/vpp emit-program-asm --target x86_64-unknown-linux-gnu "$probe" -o "$RUNNER_TEMP/linux-probe.S"
          clang -target x86_64-unknown-linux-gnu -DVPP_AOT_VPP_RUNTIME=1 \
            -I scripts/ASM -I scripts/ASM/common -c "$RUNNER_TEMP/linux-probe.S" -o "$RUNNER_TEMP/linux-probe.o"
          before=$(shasum -a 256 "$probe")
          if build-pure-vpp/bin/vpp emit-program-asm --target x86_64-unknown-linux-gnu "$probe" -o "$probe"; then
            echo 'Cross emitter overwrote its input'; exit 1
          fi
          test "$before" = "$(shasum -a 256 "$probe")"
      - name: Upload full compiler
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-full
          path: ${{ runner.temp }}/vpp-macos-arm64.tar.gz
          if-no-files-found: error
      - name: Check AOT compiler batch parity
        run: |
          package="$RUNNER_TEMP/vpp-install"
          python3 scripts/quality/check_full_batch.py --compiler "$package/bin/vpp" --logs regression-build-logs/batch-parity
      - name: Build VPP and VDK release candidates
        run: python3 scripts/quality/package_release.py --platform macos-arm64 --prefix "$RUNNER_TEMP/vpp-install" --output "$RUNNER_TEMP/release-candidates"
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: ${{ runner.temp }}/release-candidates/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload build and test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-logs
          path: |
            regression-build-logs/
            build-pure-vpp/Testing/Temporary/
            build-pure-vpp/full-compiler-profile.log
            ${{ runner.temp }}/macos-full/**/*.log
            ${{ runner.temp }}/macos-full/convergence.sha256
            ${{ runner.temp }}/host-regression/
          if-no-files-found: ignore
  linux-i32:
    name: Linux x86-64 - i32 source bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify seed
        run: |
          (cd bootstrap/linux-x86_64 && sha256sum -c SHA256SUMS)
          bash scripts/quality/audit_linux_static_elf.sh bootstrap/linux-x86_64/vpp-i32
      - name: Build assembler, host and compiler from source
        run: bash scripts/quality/check_linux_source_bootstrap.sh "$GITHUB_WORKSPACE/bootstrap/linux-x86_64/vpp-i32" "$RUNNER_TEMP/linux-bootstrap"
      - name: Package and test the Linux i32 distribution
        run: |
          package="$RUNNER_TEMP/linux-package"
          mkdir -p "$package/bin" "$package/scripts/ASM/linux"
          cp -R "$RUNNER_TEMP/linux-bootstrap/source/gói" "$package/"
          install -m 755 "$RUNNER_TEMP/linux-bootstrap/selfhost/vpp-native-stage2" "$package/bin/vpp-i32"
          install -m 644 "$RUNNER_TEMP/linux-bootstrap/host-stage2.o" "$package/scripts/ASM/linux/vpp_aot_primitives_linux_x86_64.o"
          tar -C "$package" -czf "$RUNNER_TEMP/vpp-linux-x86_64-i32.tar.gz" .
          extracted="$RUNNER_TEMP/linux-extracted"
          mkdir -p "$extracted"
          tar -C "$extracted" -xzf "$RUNNER_TEMP/vpp-linux-x86_64-i32.tar.gz"
          export VPP_HOME="$extracted" VPP_NATIVE_ELF_LINK=1 VPP_NATIVE_NO_CACHE=1
          printf 'hàm chính() { trả về 42; };\n' > "$RUNNER_TEMP/probe.vi"
          "$extracted/bin/vpp-i32" build "$RUNNER_TEMP/probe.vi" -o "$RUNNER_TEMP/linux-probe"
          status=0
          "$RUNNER_TEMP/linux-probe" || status=$?
          test "$status" -eq 42
      - uses: actions/upload-artifact@v4
        with:
          name: linux-i32-selfhost
          path: ${{ runner.temp }}/vpp-linux-x86_64-i32.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bootstrap-logs
          path: ${{ runner.temp }}/linux-bootstrap/**/*.log
          if-no-files-found: ignore
  linux-full:
    name: Linux x86-64 - full dynamic compiler
    runs-on: ubuntu-24.04
    needs: linux-i32
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development headers for AOT programs
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: linux-i32-selfhost
          path: ${{ runner.temp }}/linux-i32
      - name: Prepare runtime
        run: |
          mkdir -p "$RUNNER_TEMP/linux-i32-prefix"
          tar -C "$RUNNER_TEMP/linux-i32-prefix" -xzf "$RUNNER_TEMP/linux-i32/vpp-linux-x86_64-i32.tar.gz"
          bash scripts/quality/check_linux_full_bootstrap.sh --phase prepare "$RUNNER_TEMP/linux-full" "$RUNNER_TEMP/linux-i32-prefix"
      - name: Bootstrap full compiler (Stage 1)
        run: bash scripts/quality/check_linux_full_bootstrap.sh --phase stage1 "$RUNNER_TEMP/linux-full"
      - name: Self-host Stage 2
        run: bash scripts/quality/check_linux_full_bootstrap.sh --phase stage2 "$RUNNER_TEMP/linux-full"
      - name: Self-host Stage 3
        run: bash scripts/quality/check_linux_full_bootstrap.sh --phase stage3 "$RUNNER_TEMP/linux-full"
      - name: Verify binary convergence
        run: bash scripts/quality/check_linux_full_bootstrap.sh --phase convergence "$RUNNER_TEMP/linux-full"
      - name: Run tests
        run: bash scripts/quality/check_linux_full_bootstrap.sh --phase test "$RUNNER_TEMP/linux-full"
      - name: Package and test installed compiler
        run: |
          echo '[Biên dịch V++ Linux đầy đủ  90%] Đóng gói và chạy thử bộ biên dịch'
          out="$RUNNER_TEMP/linux-full"
          package="$out/package"
          mkdir -p "$package/bin" "$package/share/vpp/native-vpp-runtime" "$package/share/vpp/scripts/quality"
          install -m 755 "$out/vpp-native-stage3" "$package/bin/vpp-native"
          install -m 755 "$out/i32/bin/vpp-i32" "$package/bin/vpp-i32"
          install -m 644 "$out/runtime.o" "$package/share/vpp/native-vpp-runtime/runtime.o"
          platform_objects="$package/share/vpp/native-vpp-runtime/linux-objects"
          mkdir -p "$platform_objects"
          for part in start syscalls runtime_core directory sha256 process socket aot_runtime_bridge f64; do
            clang -target x86_64-unknown-linux-gnu -I scripts/ASM -I scripts/ASM/common \
              -c "scripts/ASM/linux/vpp_linux_${part}_x86_64.S" -o "$platform_objects/$part.o"
          done
          cp -R "$out/i32/gói" "$package/share/vpp/"
          cp -R scripts/ASM "$package/share/vpp/scripts/"
          mkdir -p "$package/share/vpp/scripts/graphics"
          install -m 644 scripts/graphics/CMakeLists.txt scripts/graphics/*.py "$package/share/vpp/scripts/graphics/"
          install -m 644 "$out/i32/scripts/ASM/linux/vpp_aot_primitives_linux_x86_64.o" "$package/share/vpp/scripts/ASM/linux/"
          install -m 644 scripts/quality/audit_linux_{static,tls}_elf.sh "$package/share/vpp/scripts/quality/"
          install -m 644 vpp-language.json vpp-libraries.json "$package/share/vpp/"
          sed 's|@VPP_SOURCE_ROOT@|""|g' scripts/macos/vpp-native-launcher.sh.in > "$package/bin/vpp"
          chmod 755 "$package/bin/vpp"
          bash scripts/linux/build-vpp-vm.sh "$package/bin/vpp-i32" "$package/bin/vpp-vm"
          VPP_HOME="$GITHUB_WORKSPACE" VPP_AOT_VPP_OBJECT="$out/runtime.o" VPP_AOT_ASSEMBLER="$(command -v clang)" \
            cmake -DVPP_ROOT="$GITHUB_WORKSPACE" -DVPP_NATIVE_COMPILER="$out/vpp-native-stage3" \
              -DVPP_VM="$package/bin/vpp-vm" -DVPP_OUTPUT_DIR="$out/compiler-workers" \
              -P scripts/quality/check_compiler_workers.cmake
          VPP_AOT_LINUX_TLS=0 VPP_AOT_LINUX_OBJECT_DIR="$platform_objects" "$package/bin/vpp" build "$package/share/vpp/gói/biên dịch/dòng lệnh JIT.vi" -o "$package/bin/vpp-jit"
          "$package/bin/vpp" vm-build "$package/share/vpp/gói/máy ảo/nhà cung cấp DNS.vi" -o "$package/bin/dns-provider.vmb"
          cp -R templates "$package/share/vpp/"
          VPP_AOT_LINUX_OBJECT_DIR="$platform_objects" "$package/bin/vpp" build scripts/vdk/vpp-cli.vi -o "$package/bin/vpp-tools"
          for mode in format diagnostics; do
            cmake -DVPP_CLI="$package/bin/vpp" -DVPP_NATIVE_COMPILER="$package/bin/vpp-native" -DVPP_ROOT="$package/share/vpp" -DVPP_OUTPUT_DIR="$out/lsp-$mode" -DVPP_LSP_MODE="$mode" -P scripts/quality/check_native_lsp.cmake
          done
          python3 scripts/quality/check_native_lsp_catalog.py "$package/bin/vpp-tools" "$package/bin/vpp-native" "$package/share/vpp"
          python3 scripts/quality/check_native_lsp_semantic.py "$package/bin/vpp-tools" "$package/bin/vpp-native" "$package/share/vpp"
          python3 scripts/quality/check_native_package_manager.py "$package/bin/vpp-tools" "$package/bin/vpp-native"
          tar -C "$package" -czf "$RUNNER_TEMP/vpp-linux-x86_64-full.tar.gz" .
          mkdir -p "$out/extracted"
          tar -C "$out/extracted" -xzf "$RUNNER_TEMP/vpp-linux-x86_64-full.tar.gz"
          printf 'hàm chính() { in 42; };\n' > "$out/package-probe.vi"
          unset VPP_HOME VPP_AOT_VPP_OBJECT VPP_AOT_ASSEMBLER
          test "$("$out/extracted/bin/vpp" run "$out/package-probe.vi")" = 42
          bash scripts/quality/audit_linux_static_elf.sh "$out/extracted/bin/vpp-native"
          bash scripts/quality/audit_linux_static_elf.sh "$out/extracted/bin/vpp-vm"
          "$out/extracted/bin/vpp" vm-build "$out/package-probe.vi" -o "$out/package-probe.vmb"
          test "$(PATH= "$out/extracted/bin/vpp-vm" "$out/package-probe.vmb")" = 42
          test "$("$out/extracted/bin/vpp" chạy --artifact "$out/package-probe.vmb")" = 42
          test "$(PATH= "$out/extracted/bin/vpp-jit" "$out/package-probe.vi")" = 42
          test "$(VPP_AOT_ASSEMBLER=/assembler-must-not-run "$out/extracted/bin/vpp" jit "$out/package-probe.vi")" = 42
          bash scripts/quality/audit_linux_static_elf.sh "$out/extracted/bin/vpp-jit"
          python3 scripts/quality/check_jit_cli.py "$out/extracted/bin/vpp-jit"
          python3 scripts/quality/check_jit_dynamic.py "$out/extracted/bin/vpp-jit" "$out/extracted/share/vpp"
          VPP_AOT_LINUX_OBJECT_DIR="$out/extracted/share/vpp/native-vpp-runtime/linux-objects" python3 scripts/quality/run_native_regression.py --suite host --backend aot --compiler "$out/extracted/bin/vpp" --timeout 900 --logs "$out/host-regression"
          echo '[Biên dịch V++ Linux đầy đủ 100%] Biên dịch và kiểm tra gói cài đặt hoàn tất'
      - name: Upload full compiler
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-full
          path: ${{ runner.temp }}/vpp-linux-x86_64-full.tar.gz
          if-no-files-found: error
      - name: Check AOT compiler batch parity
        run: |
          package="$RUNNER_TEMP/linux-full/extracted"
          export VPP_AOT_LINUX_OBJECT_DIR="$package/share/vpp/native-vpp-runtime/linux-objects"
          python3 scripts/quality/check_full_batch.py --compiler "$package/bin/vpp" --logs regression-build-logs/batch-parity
      - name: Build VPP and VDK release candidates
        run: python3 scripts/quality/package_release.py --platform linux-x64 --prefix "$RUNNER_TEMP/linux-full/package" --output "$RUNNER_TEMP/release-candidates"
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: ${{ runner.temp }}/release-candidates/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload build and test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-full-test-logs
          path: |
            regression-build-logs/
            ${{ runner.temp }}/linux-full/**/*.log
            ${{ runner.temp }}/linux-full/convergence.sha256
            ${{ runner.temp }}/linux-full/host-regression/
          if-no-files-found: ignore
  windows-i32:
    name: Windows x86-64 - native i32 selfhost
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check regression runner configuration
        shell: pwsh
        run: |
          python scripts/quality/test_script_configuration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/windows/test-runner-support.ps1
          & ./scripts/windows/run-tests.ps1 -Inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native seed and assemble Windows boundary
        shell: pwsh
        run: |
          $seed = "$env:GITHUB_WORKSPACE/bootstrap/windows-x86_64/vpp-i32.exe"
          $pins = @(Get-Content "$env:GITHUB_WORKSPACE/bootstrap/windows-x86_64/SHA256SUMS" | Where-Object { $_ -cmatch '^[0-9a-f]{64}  vpp-i32\.exe$' })
          if ($pins.Count -ne 1) { throw 'Missing or duplicate Windows i32 seed pin' }
          $expected = $pins[0].Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $seed).Hash -ne $expected) { throw 'Windows seed checksum mismatch' }
          python scripts/quality/check_native_executable_layout.py $seed
          if ($LASTEXITCODE -ne 0) { throw 'Windows seed PE audit failed' }
          $out = "$env:RUNNER_TEMP/windows-seed"
          New-Item -ItemType Directory -Path $out | Out-Null
          clang -target x86_64-pc-windows-msvc -DVPP_NATIVE_RUNTIME_STACK_ABI=1 -DVPP_JIT_DISABLED=1 -DVPP_WINDOWS_I32_BOOTSTRAP=1 -c scripts/ASM/windows/vpp_aot_primitives_windows_x86_64.S -o "$out/windows-runtime.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Windows boundary assembly failed' }
      - name: Bootstrap current Windows i32 compiler from source
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/windows-seed"
          $seed = "$env:GITHUB_WORKSPACE/bootstrap/windows-x86_64/vpp-i32.exe"
          $compiler = "$out/vpp-i32.exe"
          $env:VPP_HOME = $env:GITHUB_WORKSPACE.Replace([char]92, [char]47)
          $env:VPP_NATIVE_NO_CACHE = '1'
          $env:VPP_NATIVE_TARGET = 'windows-x86_64'
          $env:VPP_WINDOWS_RUNTIME_OBJECT = "$out/windows-runtime.obj".Replace([char]92, [char]47)
          $source = "$env:GITHUB_WORKSPACE/gói/biên dịch/bản địa/bộ biên dịch.vi".Replace([char]92, [char]47)
          # The pinned seed may still emit the previous compiler's PE layout.
          # Rebuild from current source before starting the three-stage gate.
          $PSNativeCommandUseErrorActionPreference = $false
          & $seed build $source -o $compiler 2>&1 | Tee-Object -FilePath "$out/bootstrap.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows i32 source bootstrap failed: $LASTEXITCODE" }
          python scripts/quality/check_native_executable_layout.py $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt Windows compiler PE audit failed' }
      - name: Rebuild and execute native Windows compiler
        shell: pwsh
        run: |
          & ./scripts/quality/check_windows_native_pe_selfhosting.ps1 -SeedCompiler "$env:RUNNER_TEMP/windows-seed/vpp-i32.exe" -RuntimeObject "$env:RUNNER_TEMP/windows-seed/windows-runtime.obj" -OutputDirectory "$env:RUNNER_TEMP/windows-selfhost"
      - name: Package and test the Windows i32 distribution
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'windows-package'
          New-Item -ItemType Directory -Path "$package/bin" | Out-Null
          Copy-Item -Recurse -LiteralPath "$env:GITHUB_WORKSPACE/gói" -Destination $package
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/windows-selfhost/stage3.exe" -Destination "$package/bin/vpp-i32.exe"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/windows-selfhost/windows-runtime.obj" -Destination "$package/windows-runtime.obj"
          $archive = "$env:RUNNER_TEMP/vpp-windows-x86_64-i32.zip"
          # Python sets the UTF-8 ZIP filename flag for Vietnamese module names.
          python -c "import pathlib,sys,zipfile; root=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_DEFLATED); [z.write(p, p.relative_to(root).as_posix()) for p in sorted(root.rglob('*')) if p.is_file()]; z.close()" $package $archive
          if ($LASTEXITCODE -ne 0) { throw 'UTF-8 archive creation failed' }
          $extracted = Join-Path $env:RUNNER_TEMP 'windows-extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $env:VPP_HOME = $extracted.Replace([char]92, [char]47)
          $env:VPP_NATIVE_TARGET = 'windows-x86_64'
          $env:VPP_NATIVE_NO_CACHE = '1'
          $env:VPP_WINDOWS_RUNTIME_OBJECT = "$extracted/windows-runtime.obj"
          $probe = "$env:RUNNER_TEMP/package-probe.vi"
          [IO.File]::WriteAllText($probe, 'hàm chính() { trả về 42; };' + "`n", [Text.UTF8Encoding]::new($false))
          $PSNativeCommandUseErrorActionPreference = $false
          & "$extracted/bin/vpp-i32.exe" build $probe -o "$env:RUNNER_TEMP/package-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged compiler build failed: $LASTEXITCODE" }
          & "$env:RUNNER_TEMP/package-probe.exe"
          if ($LASTEXITCODE -ne 42) { throw "Packaged program returned $LASTEXITCODE" }
          # The probe intentionally exits 42; the packaging step succeeded.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-i32-selfhost
          path: ${{ runner.temp }}/vpp-windows-x86_64-i32.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selfhost-logs
          path: |
            ${{ runner.temp }}/windows-seed/bootstrap.log
            ${{ runner.temp }}/windows-selfhost/*.log
            ${{ runner.temp }}/windows-selfhost/sha256.txt
          if-no-files-found: ignore

  windows-full:
    name: Windows x86-64 - full dynamic compiler
    runs-on: windows-2025
    needs: windows-i32
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-i32-selfhost
          path: ${{ runner.temp }}/windows-i32
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-llvm
      - name: Prepare runtime
        shell: pwsh
        run: |
          $toolchain = '${{ steps.msys2.outputs.msys2-location }}/clang64/bin'
          $env:PATH = "$toolchain;$env:PATH"
          $toolchain | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VPP_CI_CLANG=$toolchain/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prefix = "$env:RUNNER_TEMP/windows-i32-prefix"
          python -m zipfile -e "$env:RUNNER_TEMP/windows-i32/vpp-windows-x86_64-i32.zip" $prefix
          if ($LASTEXITCODE -ne 0) { throw 'Windows i32 extraction failed' }
          python scripts/quality/check_windows_full_bootstrap.py --clang "$toolchain/clang.exe" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix $prefix --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows native worker machine boundary
        shell: pwsh
        run: python scripts/quality/check_worker_machine.py
      - name: Bootstrap full compiler (Stage 1)
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase stage1
      - name: Self-host Stage 2
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase stage2
      - name: Self-host Stage 3
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase stage3
      - name: Verify binary convergence
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase convergence
      - name: Run tests
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase test
      - name: Package and test installed compiler
        shell: pwsh
        run: python scripts/quality/check_windows_full_bootstrap.py --clang "$env:VPP_CI_CLANG" bootstrap "$env:RUNNER_TEMP/windows-full" --i32-prefix "$env:RUNNER_TEMP/windows-i32-prefix" --archive "$env:RUNNER_TEMP/vpp-windows-x86_64-full.zip" --phase package
      - name: Check native LSP
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/windows-full/extracted"
          foreach ($mode in @('format', 'diagnostics')) {
            cmake "-DVPP_CLI=$package/bin/vpp.cmd" "-DVPP_NATIVE_COMPILER=$package/bin/vpp-native.exe" "-DVPP_ROOT=$package/share/vpp" "-DVPP_OUTPUT_DIR=$env:RUNNER_TEMP/lsp-$mode" "-DVPP_LSP_MODE=$mode" -P scripts/quality/check_native_lsp.cmake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/quality/check_native_lsp_catalog.py "$package/bin/vpp-tools.exe" "$package/bin/vpp-native.exe" "$package/share/vpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality/check_native_lsp_semantic.py "$package/bin/vpp-tools.exe" "$package/bin/vpp-native.exe" "$package/share/vpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality/check_native_package_manager.py "$package/bin/vpp-tools.exe" "$package/bin/vpp-native.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload full compiler
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-full
          path: ${{ runner.temp }}/vpp-windows-x86_64-full.zip
          if-no-files-found: error
      - name: Check AOT compiler batch parity
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/windows-full/extracted"
          python scripts/quality/check_full_batch.py --compiler "$package/bin/vpp-native.exe" --clang "$env:VPP_CI_CLANG" --logs regression-build-logs/batch-parity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build VPP and VDK release candidates
        shell: pwsh
        run: |
          python scripts/quality/package_release.py --platform windows-x64 --prefix "$env:RUNNER_TEMP/windows-full/package" --output "$env:RUNNER_TEMP/release-candidates"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-candidates/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload build and test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-full-test-logs
          path: |
            regression-build-logs/
            ${{ runner.temp }}/windows-full/**/*.log
            ${{ runner.temp }}/windows-full/convergence.sha256
            ${{ runner.temp }}/windows-full/host-regression/
          if-no-files-found: ignore

  macos-regression:
    name: macOS ARM64 - JIT regression
    needs: macos-full
    runs-on: macos-15
    # Cold JIT includes parsing, linking and native code generation per case.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-full
          path: ${{ runner.temp }}/regression-package
      - name: Extract compiler
        id: compiler
        run: |
          mkdir -p "$RUNNER_TEMP/regression-compiler"
          tar -C "$RUNNER_TEMP/regression-compiler" -xzf "$RUNNER_TEMP/regression-package/vpp-macos-arm64.tar.gz"
      - name: Run full V++ regression (JIT only)
        run: |
          python3 scripts/quality/run_native_regression.py --suite full --backend jit --jit "$RUNNER_TEMP/regression-compiler/bin/vpp-jit" --jobs 2 --timeout 900 --profile --logs regression-logs/full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-regression-logs
          path: regression-logs/

  linux-regression:
    name: Linux x86-64 - JIT regression
    needs: linux-full
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite runtime dependency
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-full
          path: ${{ runner.temp }}/regression-package
      - name: Extract compiler
        id: compiler
        run: |
          mkdir -p "$RUNNER_TEMP/regression-compiler"
          tar -C "$RUNNER_TEMP/regression-compiler" -xzf "$RUNNER_TEMP/regression-package/vpp-linux-x86_64-full.tar.gz"
      - name: Run full V++ regression (JIT only)
        run: |
          python3 scripts/quality/run_native_regression.py --suite full --backend jit --jit "$RUNNER_TEMP/regression-compiler/bin/vpp-jit" --jobs 2 --timeout 900 --profile --logs regression-logs/full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-regression-logs
          path: regression-logs/

  windows-regression:
    name: Windows x86-64 - JIT regression
    needs: windows-full
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite runtime dependency
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3.exe -ErrorAction SilentlyContinue)) {
            choco install sqlite -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-full
          path: ${{ runner.temp }}/regression-package
      - name: Extract compiler
        id: compiler
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/regression-compiler"
          python -m zipfile -e "$env:RUNNER_TEMP/regression-package/vpp-windows-x86_64-full.zip" $package
          if ($LASTEXITCODE -ne 0) { throw 'Windows full package extraction failed' }
      - name: Run full V++ regression (JIT only)
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/regression-compiler"
          python scripts/quality/run_native_regression.py --suite full --backend jit --jit "$package/bin/vpp-jit.exe" --jobs 2 --timeout 900 --profile --logs regression-logs/full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-regression-logs
          path: regression-logs/

  release-assets:
    name: Attach verified VPP and VDK packages
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [macos-regression, linux-regression, windows-regression, posix-worker-machine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-candidates
      - name: Verify checksums and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd release-candidates
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 6
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          sha256sum -c -- *.sha256
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -- *
