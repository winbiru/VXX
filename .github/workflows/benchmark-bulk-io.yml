name: V++ bulk I/O benchmark (manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Short correctness smoke or larger cached-throughput runs
        required: true
        type: choice
        options:
          - smoke
          - standard
        default: smoke

permissions:
  contents: read

jobs:
  bulk-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vectorized Python benchmarks for standard profile
        if: inputs.profile == 'standard'
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "polars>=1,<2"
      - name: Initialize Windows native toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libjitterentropy3-dev zlib1g-dev libzstd-dev libffi-dev pkg-config
      - name: Build prerequisites on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Build V++ VM
        run: |
          cmake -S . -B build-bulk-vpp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build-bulk-vpp --config Release --parallel 2 --target vpp-cli
      - name: Run bulk suite
        shell: pwsh
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          $paths = @('build-bulk-vpp/bin/vpp-cli', 'build-bulk-vpp/bin/vpp-cli.exe', 'build-bulk-vpp/bin/Release/vpp-cli.exe', 'build-bulk-vpp/Release/vpp-cli.exe')
          $cli = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw 'Built V++ CLI not found' }
          $argsList = @('scripts/quality/benchmark_bulk_io.py', '--vpp-cli', $cli, '--output-dir', 'build-bulk-evidence')
          if ($env:PROFILE -eq 'smoke') { $argsList += '--smoke' }
          else { $argsList += @('--sizes-kib', '16,256', '--runs', '3', '--timeout-s', '240') }
          python @argsList
          if ($LASTEXITCODE -ne 0) { throw "Bulk I/O benchmark failed ($LASTEXITCODE)" }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-benchmark-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build-bulk-evidence/results.json
            build-bulk-evidence/summary.md
            build-bulk-evidence/comparisons.md
