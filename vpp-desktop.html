<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V++ desktop</title><style>body{font:16px system-ui;margin:24px;background:#f5f7fa;color:#17243a}main{box-sizing:border-box;background:white;padding:20px;border-radius:12px;max-width:640px;min-height:400px}button,input{font:inherit;padding:8px}button{cursor:pointer}table{border-collapse:collapse}td,th{border:1px solid #ccd4df;padding:8px}svg{max-width:100%;height:auto}</style><main tabindex="0"><button type="button" data-vpp="chao">Xin chào</button><label>Tên <input type="text" data-vpp="ten" value=""></label></main><button type="button" id="vpp-export">Xuất sự kiện JSON</button><script>const q=[];let chain=Promise.resolve();function send(e){if(q.length>=10000)q.shift();q.push(e);if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.vpp){window.webkit.messageHandlers.vpp.postMessage(e);return;}if(location.protocol==='http:'||location.protocol==='https:'){chain=chain.then(()=>fetch('/vpp-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)})).catch(()=>{});}}const root=document.querySelector('main');root.addEventListener('click',e=>{const t=e.target.closest('button[data-vpp]');if(t)send({'loại':'nút','mã':t.dataset.vpp});});root.addEventListener('change',e=>{const t=e.target;if(t.matches('input[data-vpp]'))send({'loại':'ô nhập','mã':t.dataset.vpp,'giá trị':t.value});});for(const k of ['keydown','keyup'])root.addEventListener(k,e=>{if(!e.target.matches('input,textarea'))send({'loại':'bàn phím','phím':e.key,'đang nhấn':k==='keydown'});});for(const k of ['pointerdown','pointerup'])root.addEventListener(k,e=>{const r=root.getBoundingClientRect();send({'loại':'chuột',x:Math.floor(e.clientX-r.left),y:Math.floor(e.clientY-r.top),'nút':e.button,'đang nhấn':k==='pointerdown'});});document.getElementById('vpp-export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(q)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='vpp-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};</script></html>
